# SuiteManifest v1 for the MVP synthetic CSV task family.
#
# Thresholds are pre-registered (ADR 0004): C - A >= +10pp with a positive lower
# bootstrap bound, cost <= 2x the memory arm, regression <= 5pp. They must never
# be edited after the first real run; a changed threshold invalidates the report
# and requires a new suite version.
#
# `sealed = true` from csv-stats-v1.1: the test split is only reachable through
# `SealedTestSet` and `silyn-eval run --split test --allow-sealed`, which first
# verifies `suite.lock`. The lock freezes this file and README.md, so any edit
# must ship a new suite version; regenerating digests in place is forbidden.

suite_id = "csv-stats-v1"
version = "csv-stats-v1.1"
task_family = "csv-stats"
repeats = 1
sealed = true

[thresholds]
min_gain_pp = 10.0
max_cost_ratio = 2.0
max_regression_pp = 5.0
# Absolute cap for a paid provider; the mock provider spends nothing.
max_cost_usd = 1.0

