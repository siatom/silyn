# Acceptance registry.
#
# Each gate maps a stable gate id to an executable test. CI (`cargo xtask
# verify-acceptance`) fails when a required test disappears or is #[ignore]d.
# Tests may be added; removing or renaming one requires an integrator commit.

[[gate]]
id = "core.state_machine.task_happy_path"
test = "crates/silyn-core/tests/state_machine.rs::task_happy_path_is_reachable"
required = true

[[gate]]
id = "core.state_machine.terminal_states_are_final"
test = "crates/silyn-core/tests/state_machine.rs::terminal_states_are_final"
required = true

[[gate]]
id = "core.state_machine.run_cannot_skip_verification"
test = "crates/silyn-core/tests/state_machine.rs::run_cannot_skip_verification"
required = true

[[gate]]
id = "core.state_machine.candidate_cannot_skip_evaluation"
test = "crates/silyn-core/tests/state_machine.rs::candidate_cannot_promote_without_evaluation"
required = true

[[gate]]
id = "core.errors.only_transient_is_retryable"
test = "crates/silyn-core/src/error.rs::only_transient_errors_are_retryable"
required = true

[[gate]]
id = "core.ids.time_ordered"
test = "crates/silyn-core/src/ids.rs::ids_are_time_ordered_and_round_trip"
required = true

[[gate]]
id = "core.events.envelope_round_trip"
test = "crates/silyn-core/src/event.rs::envelope_round_trips"
required = true

[[gate]]
id = "storage.migrations_apply"
test = "crates/silyn-storage/tests/storage.rs::migrations_apply_once"
required = true

[[gate]]
id = "storage.fts5_available"
test = "crates/silyn-storage/tests/storage.rs::fts5_is_available"
required = true

[[gate]]
id = "storage.foreign_keys_enforced"
test = "crates/silyn-storage/tests/storage.rs::foreign_keys_are_enforced"
required = true

[[gate]]
id = "storage.records_round_trip"
test = "crates/silyn-storage/tests/storage.rs::records_round_trip"
required = true

[[gate]]
id = "storage.duplicate_ids_rejected"
test = "crates/silyn-storage/tests/storage.rs::duplicate_ids_are_rejected"
required = true

[[gate]]
id = "storage.transaction_rollback"
test = "crates/silyn-storage/tests/storage.rs::transaction_rollback_leaves_no_rows"
required = true

[[gate]]
id = "storage.journal_round_trip"
test = "crates/silyn-storage/tests/journal.rs::event_round_trip"
required = true

[[gate]]
id = "storage.event_seq_conflict"
test = "crates/silyn-storage/tests/journal.rs::event_seq_conflict_is_transient"
required = true

[[gate]]
id = "storage.state_and_event_same_transaction"
test = "crates/silyn-storage/tests/journal.rs::state_and_event_share_transaction"
required = true

[[gate]]
id = "storage.outbox_idempotent"
test = "crates/silyn-storage/tests/journal.rs::outbox_is_idempotent"
required = true

[[gate]]
id = "storage.ledger_blocks_duplicate_call"
test = "crates/silyn-storage/tests/journal.rs::ledger_blocks_duplicate_call"
required = true

[[gate]]
id = "storage.checkpoint_integrity"
test = "crates/silyn-storage/tests/journal.rs::checkpoint_integrity"
required = true

[[gate]]
id = "llm.openai_compatible_request_shape"
test = "crates/silyn-llm/tests/llm.rs::request_shape_matches_openai_protocol"
required = true

[[gate]]
id = "llm.rate_limit_is_retried"
test = "crates/silyn-llm/tests/llm.rs::rate_limit_is_retried"
required = true

[[gate]]
id = "llm.bad_request_is_not_retried"
test = "crates/silyn-llm/tests/llm.rs::bad_request_is_not_retried"
required = true

[[gate]]
id = "llm.structured_output_repairs_once"
test = "crates/silyn-llm/tests/llm.rs::structured_output_repairs_once"
required = true

[[gate]]
id = "llm.cassette_replays_offline"
test = "crates/silyn-llm/tests/llm.rs::cassette_replays_by_prompt"
required = true

[[gate]]
id = "llm.mock_provider_offline"
test = "crates/silyn-llm/tests/llm.rs::mock_provider_is_offline"
required = true

# Contract tests stay ignored until their subsystem lands. They are tracked from
# W0 so the registry cannot silently lose them.
[[gate]]
id = "contracts.model_provider"
test = "crates/silyn-core/tests/contracts.rs::model_provider_round_trip"
required = false

[[gate]]
id = "contracts.memory_repository"
test = "crates/silyn-core/tests/contracts.rs::memory_search_returns_provenance"
required = false

[[gate]]
id = "contracts.promotion_gate"
test = "crates/silyn-core/tests/contracts.rs::promotion_gate_requires_low_risk_for_auto"
required = false
