# W4-03 acceptance gates: memory-aware context, verifier wiring and experience
# extraction.
#
# `cargo run -p xtask -- verify-acceptance` resolves every entry against the
# real test source. Removing or renaming a test requires an integrator commit.

[[gate]]
id = "context.memory_injected_with_ids"
test = "crates/silyn-app/src/runtime_service.rs::memory_injected_with_ids"
required = true

[[gate]]
id = "context.memory_scope_isolation"
test = "crates/silyn-app/src/runtime_service.rs::memory_scope_isolation"
required = true

