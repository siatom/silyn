name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Stable toolchain, pinned to the same version as rust-toolchain.toml.
          toolchain: "1.99.0"
          components: rustfmt, clippy

      # Caches the cargo registry and target directory for this runner/toolchain.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --workspace --release

      - name: Gate - docs
        run: cargo run -p xtask -- verify-docs

      - name: Gate - acceptance registry
        run: cargo run -p xtask -- verify-acceptance

      - name: Gate - schemas
        run: cargo run -p xtask -- verify-schemas

      - name: Gate - migrations
        run: cargo run -p xtask -- verify-migrations

      - name: Gate - architecture
        run: cargo run -p xtask -- verify-arch

      - name: Gate - eval integrity
        run: cargo run -p xtask -- verify-eval-integrity

      - name: Smoke - CLI version
        run: cargo run --quiet --release -p silyn-cli -- --version

      - name: Smoke - doctor JSON
        env:
          # Keep the smoke home out of the checkout. The directory is ephemeral.
          SILYN_HOME: ${{ runner.temp }}/silyn-home
        run: cargo run --quiet --release -p silyn-cli -- --json doctor
